name: Deploy to InfinityFree

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          FTP_HOST: ${{ secrets.INFINITYFREE_FTP_HOST }}
          FTP_USER: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          DB_HOST: ${{ secrets.INFINITYFREE_DB_HOST }}
          DB_NAME: ${{ secrets.INFINITYFREE_DB_NAME }}
          DB_USER: ${{ secrets.INFINITYFREE_DB_USERNAME }}
          DB_PASS: ${{ secrets.INFINITYFREE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          [ -n "$FTP_HOST" ] || { echo "ERROR: INFINITYFREE_FTP_HOST is missing"; exit 1; }
          [ -n "$FTP_USER" ] || { echo "ERROR: INFINITYFREE_FTP_USERNAME is missing"; exit 1; }
          [ -n "$FTP_PASS" ] || { echo "ERROR: INFINITYFREE_FTP_PASSWORD is missing"; exit 1; }
          [ -n "$DB_HOST" ] || { echo "ERROR: INFINITYFREE_DB_HOST is missing"; exit 1; }
          [ -n "$DB_NAME" ] || { echo "ERROR: INFINITYFREE_DB_NAME is missing"; exit 1; }
          [ -n "$DB_USER" ] || { echo "ERROR: INFINITYFREE_DB_USERNAME is missing"; exit 1; }
          [ -n "$DB_PASS" ] || { echo "ERROR: INFINITYFREE_DB_PASSWORD is missing"; exit 1; }

          echo "✓ FTP credentials are configured"
          echo "✓ InfinityFree database secrets are configured"

      - name: Generate production runtime configuration
        env:
          DB_HOST: ${{ secrets.INFINITYFREE_DB_HOST }}
          DB_NAME: ${{ secrets.INFINITYFREE_DB_NAME }}
          DB_USER: ${{ secrets.INFINITYFREE_DB_USERNAME }}
          DB_PASS: ${{ secrets.INFINITYFREE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p config
          umask 077

          python3 - <<'PY'
          from pathlib import Path
          import os

          def php_quote(value):
              return "'" + value.replace('\\', '\\\\').replace("'", "\\'") + "'"

          content = "<?php\nreturn [\n"
          content += f"    'DB_HOST' => {php_quote(os.environ['DB_HOST'])},\n"
          content += f"    'DB_NAME' => {php_quote(os.environ['DB_NAME'])},\n"
          content += f"    'DB_USER' => {php_quote(os.environ['DB_USER'])},\n"
          content += f"    'DB_PASS' => {php_quote(os.environ['DB_PASS'])},\n"
          content += "    'DB_PORT' => '3306',\n];\n"
          Path('config/runtime.php').write_text(content, encoding='utf-8')
          PY

          test -s config/runtime.php
          grep -q "'DB_HOST'" config/runtime.php
          grep -q "'DB_NAME'" config/runtime.php
          grep -q "'DB_USER'" config/runtime.php
          grep -q "'DB_PASS'" config/runtime.php
          php -l config/runtime.php
          echo "✓ config/runtime.php generated (secret values not printed)"

      - name: Validate PHP
        run: |
          set -euo pipefail
          php -l config/database.php
          php -l api/diagnostic.php

      - name: Deploy application files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_HOST }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ./htdocs/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*/**
            **/.serena/**
            **/Doc/**
            **/database/**
            **/.env.example
            **/config/.env.infinityfree.example
            **/*.sql
            **/test_api.php
            **/server.js
            **/start-localhost-3000.bat
            **/uploads/**
            **/storage/**
            **/*.log

      - name: Deployment completed
        run: |
          echo "Deployment completed through FTP-Deploy-Action"
          echo "Production config/.env was generated for this deployment."
