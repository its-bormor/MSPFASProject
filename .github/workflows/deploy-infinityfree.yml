name: Deploy to InfinityFree

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create production environment file
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          set -euo pipefail
          mkdir -p deploy-config
          printf 'DB_HOST=%s\nDB_NAME=%s\nDB_USER=%s\nDB_PASS=%s\nDB_PORT=%s\n' "$DB_HOST" "$DB_NAME" "$DB_USER" "$DB_PASS" "$DB_PORT" > deploy-config/.env
          cp config/.htaccess deploy-config/.htaccess
          test "$(wc -l < deploy-config/.env)" -eq 5
          grep -q '^DB_HOST=' deploy-config/.env
          grep -q '^DB_NAME=' deploy-config/.env
          grep -q '^DB_USER=' deploy-config/.env
          grep -q '^DB_PASS=' deploy-config/.env
          grep -q '^DB_PORT=' deploy-config/.env

      - name: Deploy application files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_HOST }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ./htdocs/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*/**
            **/.serena/**
            **/Doc/**
            **/database/**
            **/config/.env
            **/.env.example
            **/config/.env.infinityfree.example
            **/*.sql
            **/test_api.php
            **/server.js
            **/start-localhost-3000.bat
            **/uploads/**
            **/storage/**
            **/*.log

      - name: Deploy production config via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_HOST }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy-config/
          server-dir: ./htdocs/config/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-config-sync-state.json
          log-level: verbose
          exclude: |
            **/.git*/**
