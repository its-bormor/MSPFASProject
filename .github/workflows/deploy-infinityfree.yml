name: Deploy to InfinityFree

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          FTP_HOST: ${{ secrets.INFINITYFREE_FTP_HOST }}
          FTP_USER: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          set -euo pipefail

          [ -n "$FTP_HOST" ] || { echo "ERROR: INFINITYFREE_FTP_HOST is missing"; exit 1; }
          [ -n "$FTP_USER" ] || { echo "ERROR: INFINITYFREE_FTP_USERNAME is missing"; exit 1; }
          [ -n "$FTP_PASS" ] || { echo "ERROR: INFINITYFREE_FTP_PASSWORD is missing"; exit 1; }

          if [ -n "$ENV_FILE" ]; then
            echo "Database configuration: ENV_FILE secret is configured"
          elif [ -n "$DB_HOST" ] && [ -n "$DB_NAME" ] && [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
            echo "Database configuration: individual DB_* secrets are configured"
          else
            echo "ERROR: configure ENV_FILE, or DB_HOST/DB_NAME/DB_USER/DB_PASS"
            exit 1
          fi

      - name: Generate production environment file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          set -euo pipefail
          mkdir -p config
          umask 077

          if [ -n "$ENV_FILE" ]; then
            printf '%s' "$ENV_FILE" > config/.env
          else
            {
              printf 'DB_HOST=%s\n' "$DB_HOST"
              printf 'DB_NAME=%s\n' "$DB_NAME"
              printf 'DB_USER=%s\n' "$DB_USER"
              printf 'DB_PASS=%s\n' "$DB_PASS"
              if [ -n "$DB_PORT" ]; then
                printf 'DB_PORT=%s\n' "$DB_PORT"
              else
                printf 'DB_PORT=3306\n'
              fi
            } > config/.env
          fi

          test -s config/.env
          for key in DB_HOST DB_NAME DB_USER DB_PASS DB_PORT; do
            grep -q "^${key}=" config/.env || { echo "ERROR: ${key} is missing from generated config/.env"; exit 1; }
          done
          echo "Production environment file created with all required keys"

      - name: Validate PHP
        run: |
          set -euo pipefail
          php -l config/database.php
          php -l api/diagnostic.php

      - name: Deploy application files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_HOST }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ./htdocs/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*/**
            **/.serena/**
            **/Doc/**
            **/database/**
            **/.env.example
            **/config/.env.infinityfree.example
            **/*.sql
            **/test_api.php
            **/server.js
            **/start-localhost-3000.bat
            **/uploads/**
            **/storage/**
            **/*.log

      - name: Deployment completed
        run: |
          echo "Deployment completed through FTP-Deploy-Action"
          echo "Production config/.env was generated for this deployment."
