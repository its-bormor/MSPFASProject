name: Validate PHP

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint application PHP
        shell: bash
        run: |
          set -e
          find api config -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l index.php
          php -l health.php
